<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 简化的前景图标 - 主要是时钟指针和中心 -->
  <defs>
    <linearGradient id="fgHandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E74C3C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 时钟指针 - 显示大约10:10的时间 -->
  <!-- 时针 -->
  <line x1="256" y1="256" x2="220" y2="180" stroke="url(#fgHandGradient)" stroke-width="8" stroke-linecap="round"/>
  <!-- 分针 -->
  <line x1="256" y1="256" x2="320" y2="140" stroke="url(#fgHandGradient)" stroke-width="6" stroke-linecap="round"/>
  <!-- 秒针 -->
  <line x1="256" y1="256" x2="280" y2="120" stroke="#FF4757" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 中心圆点 -->
  <circle cx="256" cy="256" r="12" fill="#2C3E50"/>
  
  <!-- 时钟外环突出显示 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.8"/>
</svg>