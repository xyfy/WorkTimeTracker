<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clockGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F0F8FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="handGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B6B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E74C3C;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 圆角背景 -->
  <rect width="512" height="512" rx="100" ry="100" fill="url(#bgGradient)"/>
  
  <!-- 主时钟圆盘 -->
  <circle cx="256" cy="256" r="180" fill="url(#clockGradient)" stroke="#2C3E50" stroke-width="8"/>
  
  <!-- 时钟刻度 -->
  <g stroke="#2C3E50" stroke-width="3" fill="none">
    <!-- 12点 -->
    <line x1="256" y1="85" x2="256" y2="105" stroke-width="4"/>
    <!-- 3点 -->
    <line x1="427" y1="256" x2="407" y2="256" stroke-width="4"/>
    <!-- 6点 -->
    <line x1="256" y1="427" x2="256" y2="407" stroke-width="4"/>
    <!-- 9点 -->
    <line x1="85" y1="256" x2="105" y2="256" stroke-width="4"/>
    
    <!-- 其他刻度 -->
    <line x1="384" y1="128" x2="370" y2="142"/>
    <line x1="384" y1="384" x2="370" y2="370"/>
    <line x1="128" y1="384" x2="142" y2="370"/>
    <line x1="128" y1="128" x2="142" y2="142"/>
  </g>
  
  <!-- 时钟指针 - 显示大约10:10的时间（经典时钟展示时间） -->
  <!-- 时针 -->
  <line x1="256" y1="256" x2="220" y2="180" stroke="url(#handGradient)" stroke-width="8" stroke-linecap="round"/>
  <!-- 分针 -->
  <line x1="256" y1="256" x2="320" y2="140" stroke="url(#handGradient)" stroke-width="6" stroke-linecap="round"/>
  <!-- 秒针 -->
  <line x1="256" y1="256" x2="280" y2="120" stroke="#FF4757" stroke-width="2" stroke-linecap="round"/>
  
  <!-- 中心圆点 -->
  <circle cx="256" cy="256" r="12" fill="#2C3E50"/>
  
  <!-- 工作图标 - 笔记本电脑 -->
  <g transform="translate(150,350)">
    <rect x="0" y="0" width="80" height="50" rx="4" fill="#34495E" stroke="#2C3E50" stroke-width="2"/>
    <rect x="4" y="4" width="72" height="35" fill="#3498DB"/>
    <rect x="0" y="50" width="90" height="8" rx="4" fill="#95A5A6"/>
    <circle cx="45" cy="54" r="1.5" fill="#7F8C8D"/>
  </g>
  
  <!-- 日历图标 -->
  <g transform="translate(280,350)">
    <rect x="0" y="10" width="60" height="50" rx="4" fill="#FFFFFF" stroke="#2C3E50" stroke-width="2"/>
    <rect x="0" y="10" width="60" height="15" fill="#E74C3C"/>
    <rect x="10" y="0" width="4" height="20" rx="2" fill="#95A5A6"/>
    <rect x="46" y="0" width="4" height="20" rx="2" fill="#95A5A6"/>
    
    <!-- 日期网格 -->
    <g fill="#2C3E50" font-family="Arial" font-size="8" text-anchor="middle">
      <text x="15" y="40">1</text>
      <text x="25" y="40">2</text>
      <text x="35" y="40">3</text>
      <text x="45" y="40">4</text>
      <text x="15" y="52">5</text>
      <text x="25" y="52">6</text>
      <text x="35" y="52" fill="#E74C3C" font-weight="bold">7</text>
      <text x="45" y="52">8</text>
    </g>
  </g>
  
  <!-- 进度环 - 表示工作进度 -->
  <circle cx="400" cy="150" r="35" fill="none" stroke="#ECF0F1" stroke-width="6"/>
  <circle cx="400" cy="150" r="35" fill="none" stroke="#2ECC71" stroke-width="6" 
          stroke-dasharray="154 220" stroke-dashoffset="0" transform="rotate(-90 400 150)"/>
  
  <!-- 进度百分比 -->
  <text x="400" y="155" text-anchor="middle" fill="#2C3E50" font-family="Arial" font-size="14" font-weight="bold">70%</text>
  
  <!-- 小装饰元素 - 咖啡杯 -->
  <g transform="translate(100,150)">
    <ellipse cx="0" cy="0" rx="15" ry="20" fill="#8B4513"/>
    <ellipse cx="0" cy="-5" rx="12" ry="15" fill="#D2691E"/>
    <path d="M 12 -5 Q 20 -5 20 5 Q 20 15 12 15" fill="none" stroke="#8B4513" stroke-width="2"/>
    <!-- 蒸汽 -->
    <path d="M -8 -25 Q -8 -30 -5 -30 Q -2 -30 -2 -25" fill="none" stroke="#95A5A6" stroke-width="1.5"/>
    <path d="M 0 -25 Q 0 -30 3 -30 Q 6 -30 6 -25" fill="none" stroke="#95A5A6" stroke-width="1.5"/>
    <path d="M 8 -25 Q 8 -30 11 -30 Q 14 -30 14 -25" fill="none" stroke="#95A5A6" stroke-width="1.5"/>
  </g>
</svg>